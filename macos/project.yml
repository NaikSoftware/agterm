name: Elis
options:
  bundleIdPrefix: ua.naiksoftware
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Release
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SDKROOT: macosx
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    SWIFT_STRICT_CONCURRENCY: complete
    # The ElisTests scheme intentionally builds serially so the app's deep-sign
    # phase finishes before Xcode places its hosted test bundle inside the app.
    DISABLE_MANUAL_TARGET_ORDER_BUILD_WARNING: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO

packages:
  ElisCore:
    path: ElisCore

targets:
  Elis:
    type: application
    platform: macOS
    sources:
      - path: Elis
        excludes:
          - "Info.plist"
          - "elis.entitlements"
          - "elis-debug.entitlements"
          - "Resources/ghostty"
          - "Resources/terminfo"
          - "Resources/zmx"
          - "Resources/agent-status"
          - "Resources/hud"
          - "Resources/markdown"
          - "Resources/file-icons"
          # committed SOURCE for elis's own bundled theme(s); setup.sh stages it
          # into Resources/ghostty/themes (above), so the source dir itself must not
          # be pulled into the project tree or the app bundle.
          - "Resources/custom-themes"
      # Ghostty resources (themes + shell-integration), downloaded by setup.sh.
      # Folder reference (not the default "group") because the contents are
      # extensionless files Xcode would otherwise skip. Lands at
      # Contents/Resources/ghostty — GHOSTTY_RESOURCES_DIR points here, matching
      # a real Ghostty.app so libghostty resolves themes/shell-integration and
      # derives TERMINFO as ../terminfo (the sibling dir below).
      - path: Elis/Resources/ghostty
        type: folder
        buildPhase: resources
      # Compiled terminfo DB so TERM=xterm-ghostty resolves without a
      # Ghostty.app install. Folder reference preserves the hashed macOS layout
      # (terminfo/78/xterm-ghostty) and extensionless files. MUST land at
      # Contents/Resources/terminfo — a SIBLING of ghostty/ — so libghostty's
      # dirname(GHOSTTY_RESOURCES_DIR)/terminfo derivation hits it.
      - path: Elis/Resources/terminfo
        type: folder
        buildPhase: resources
      # Agent-status hooks package (the generic wrapper, shell integration, and
      # agent-specific lifecycle adapters). Folder reference (not the default "group") so the
      # extensionless .sh files, the shell/ subdir, and the exec bit survive.
      # Lands at Contents/Resources/agent-status — the installer copies it from
      # there to ~/.config/elis/agent-status.
      - path: Elis/Resources/agent-status
        type: folder
        buildPhase: resources
      # The session.hud panel painter. Folder reference (not the default "group") so hud.sh keeps its
      # exec bit. Lands at Contents/Resources/hud — ControlServer.helperCommand() resolves it there and
      # shell-escapes it into the overlay command.
      - path: Elis/Resources/hud
        type: folder
        buildPhase: resources
      # The markdown page renderer and stylesheet, with the vendored libraries' LICENSE files, which a group
      # would drop for having no extension. Lands at Contents/Resources/markdown; MarkdownAssets reads it.
      - path: Elis/Resources/markdown
        type: folder
        buildPhase: resources
      # Atom file-icons TTF fonts with their LICENSE texts. Lands at Contents/Resources/file-icons;
      # FileIconRenderer registers the fonts from there.
      - path: Elis/Resources/file-icons
        type: folder
        buildPhase: resources
      # Agent skill package (SKILL.md + reference.md + examples.md + cookbook.md + troubleshooting.md
      # + scripts).
      # It lives at plugins/elis/skills/elis so the SAME directory is also the skill source for
      # the Claude Code and Codex plugin manifests — one copy, three consumers. Folder reference so
      # the whole dir copies verbatim to Contents/Resources/elis; the installer copies it from
      # there to ~/.claude/skills/elis.
      - path: ../plugins/elis/skills/elis
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.naiksoftware.elis
        PRODUCT_NAME: Elis
        INFOPLIST_FILE: Elis/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Elis/elis.entitlements
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0.0.0"
        GIT_COMMIT: ""
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS:
          - "-lc++"
        # Silence "umbrella header does not include header" warnings emitted
        # when Clang imports the GhosttyKit module — ghostty.h doesn't list
        # the vt/* sub-headers, and we can't modify the prebuilt xcframework.
        OTHER_SWIFT_FLAGS:
          - "-Xcc"
          - "-Wno-incomplete-umbrella"
      configs:
        # Debug/dev builds get a DISTINCT bundle id. XCUITest terminates any running instance of the
        # app-under-test's bundle id before launching, so a shared id would kill the deployed Release
        # app the user runs daily. Release keeps the real id (ua.naiksoftware.elis) — only Debug is
        # isolated. State/socket are path-based, not bundle-id-derived: a Debug launch without
        # ELIS_STATE_DIR adopts its own elis-debug directory (DebugStateDirectory).
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ua.naiksoftware.elis.debug
          # Debug alone needs the three hardened-runtime exceptions; see the header of the file.
          CODE_SIGN_ENTITLEMENTS: Elis/elis-debug.entitlements
    postBuildScripts:
      # Build the Swift helpers here; setup.sh stages the pinned zmx binary and license.
      - name: Bundle helper executables
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # the app icon is the Icon Composer `AppIcon.icon`, compiled by actool into Assets.car +
          # AppIcon.icns. xcodegen also lists it in Copy Bundle Resources, so a redundant loose
          # AppIcon.icon lands in the bundle; remove it. A loose source `.icon` renders as the generic
          # placeholder grid (so it must not win over the compiled icon), and its source xattrs would
          # otherwise trip the re-seal below.
          rm -rf "$CODESIGNING_FOLDER_PATH/Contents/Resources/AppIcon.icon"
          core="$SRCROOT/ElisCore"
          # the embedded Info.plist gives a hand-run elisctl its own TCC identity and Bluetooth usage string
          swift build --package-path "$core" -c release --product elisctl \
            -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker "$core/Sources/elisctl/Info.plist"
          swift build --package-path "$core" -c release --product elis-session-host
          src="$(swift build --package-path "$core" -c release --product elisctl --show-bin-path)/elisctl"
          host_src="$(dirname "$src")/elis-session-host"
          cli_dest="$CODESIGNING_FOLDER_PATH/Contents/MacOS/elisctl"
          host_dest="$CODESIGNING_FOLDER_PATH/Contents/MacOS/elis-session-host"
          zmx_src="$SRCROOT/Elis/Resources/zmx/zmx"
          zmx_dest="$CODESIGNING_FOLDER_PATH/Contents/MacOS/zmx"
          license_src="$SRCROOT/Elis/Resources/zmx/LICENSE"
          license_dest="$CODESIGNING_FOLDER_PATH/Contents/Resources/zmx/LICENSE"
          [ -x "$zmx_src" ] || { echo "staged zmx not found at $zmx_src" >&2; exit 1; }
          [ -f "$license_src" ] || { echo "zmx license not found at $license_src" >&2; exit 1; }
          # the build id the app compares against its state directory's record to date a zmx change
          stamp_src="$SRCROOT/.zmx-build-stamp"
          stamp_dest="$CODESIGNING_FOLDER_PATH/Contents/Resources/zmx/BUILD"
          [ -f "$stamp_src" ] || { echo "zmx build stamp not found at $stamp_src" >&2; exit 1; }
          mkdir -p "$(dirname "$cli_dest")" "$(dirname "$license_dest")"
          cp -f "$src" "$cli_dest"
          cp -f "$host_src" "$host_dest"
          cp -f "$zmx_src" "$zmx_dest"
          cp -f "$license_src" "$license_dest"
          cp -f "$stamp_src" "$stamp_dest"
          # ad-hoc sign the helpers + re-seal the app (Debug/normal builds). Developer ID signing for
          # releases is done authoritatively by scripts/release.sh AFTER xcodebuild returns (so it
          # can't be clobbered by Xcode's own final code-sign, which also adds the required timestamp).
          codesign --force --options runtime --sign - "$cli_dest"
          codesign --force --options runtime --sign - "$host_dest"
          codesign --force --options runtime --sign - "$zmx_dest"
          # re-seal the whole app: this phase can run AFTER Xcode's own code-sign on incremental
          # builds, so adding the helper would otherwise break the seal. --deep because a clean
          # build can reach here before Xcode has signed Elis.debug.dylib. Entitlements come in a
          # SECOND pass instead: --deep applies them to every nested binary, and helpers carry no app
          # TCC entitlements.
          codesign --force --deep --options runtime --sign - "$CODESIGNING_FOLDER_PATH"
          # CODE_SIGN_ENTITLEMENTS, not a literal path: Debug and Release use different files.
          codesign --force --options runtime --entitlements "$SRCROOT/$CODE_SIGN_ENTITLEMENTS" --sign - "$CODESIGNING_FOLDER_PATH"
    dependencies:
      - framework: GhosttyKit.xcframework
        embed: false
      - package: ElisCore
      - package: ElisCore
        product: ElisResponsibility
      - sdk: AppKit.framework
      # libghostty calls Text Input Source Services (TISCopyCurrentKeyboard…)
      # which live in Carbon; required to link the prebuilt xcframework.
      - sdk: Carbon.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: Foundation.framework
      - sdk: IOKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework

  ElisUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - ElisUITests
    dependencies:
      - target: Elis
      - package: ElisCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.naiksoftware.elisUITests
        TEST_TARGET_NAME: Elis
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        # UI test code drives XCTest APIs that aren't Sendable-clean; the strict
        # checking the app/ElisCore use isn't needed (and breaks) here.
        SWIFT_STRICT_CONCURRENCY: minimal
        # the runner is ad-hoc signed; hardened runtime on the test bundle causes
        # a Team-ID mismatch when the runner loads the xctest bundle.
        ENABLE_HARDENED_RUNTIME: NO

  ElisTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ElisTests
    dependencies:
      - target: Elis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.naiksoftware.elisTests
        GENERATE_INFOPLIST_FILE: YES
        # XCTest instantiates it at bundle load; it makes every hosted window transparent.
        INFOPLIST_KEY_NSPrincipalClass: HostedWindowHider
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Elis.app/Contents/MacOS/Elis"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
        # Hosted AppKit tests call isolated app code on the main actor; strict
        # checking adds XCTest boundary failures without improving that coverage.
        SWIFT_STRICT_CONCURRENCY: minimal
        # The ad-hoc-signed host must load the test bundle without Team-ID checks.
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  Elis:
    build:
      targets:
        Elis: all
        ElisUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # recording blocks ~25s per method before setUp; screenshots costs 0.13s and still captures failures
      preferredScreenCaptureFormat: screenshots
      targets:
        - ElisUITests
    archive:
      config: Release

  ElisTests:
    build:
      # The app-hosted test bundle and host must be built serially; otherwise the
      # app target's final deep-sign phase can observe a half-built xctest bundle.
      parallelizeBuild: false
      targets:
        Elis: all
        ElisTests: [test]
    test:
      config: Debug
      macroExpansion: ElisTests
      environmentVariables:
        # Application-hosted XCTest starts `elisApp.init()` before test `setUp`.
        # Isolate every eager app dependency at process launch, and keep the
        # control socket short enough for sockaddr_un without touching the live app.
        ELIS_STATE_DIR: "$(TARGET_TEMP_DIR)/ElisTests-state"
        ELIS_CONTROL_SOCKET: "/tmp/elis-hosted-tests-$(UID).sock"
        ELIS_HOSTED_TESTS: "1"
        # exercise startup normalization and preserve a non-C text locale
        # clear LC_ALL so inherited values cannot override the category fixtures
        LC_ALL: ""
        LC_NUMERIC: "ru_RU.UTF-8"
        LC_CTYPE: "ru_RU.UTF-8"
      targets:
        - ElisTests
